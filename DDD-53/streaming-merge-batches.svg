<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Streaming merge across batches</title>
<desc>A resident baseline array persists in memory across the whole poll cycle. Batches of new rows are fetched via keyset pagination and merged against the baseline one at a time, using a single forward-only pointer, then discarded, so only one batch is ever held in memory alongside the baseline.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="60" y="40" width="560" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Baseline array (resident)</text>
<text x="340" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">sorted by id, ~76MB, persists across poll</text>

<line x1="100" y1="110" x2="580" y2="110" stroke="#73726c" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.6" marker-end="url(#arrow)"/>

<line x1="135" y1="200" x2="135" y2="110" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="200" x2="340" y2="110" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="545" y1="200" x2="545" y2="110" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="45" y="200" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="135" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#085041">Batch 1</text>
<text x="135" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">ids 1 - 100k</text>

<rect x="250" y="200" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#085041">Batch 2</text>
<text x="340" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">ids 100k - 200k</text>

<rect x="455" y="200" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="545" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#085041">Batch 3</text>
<text x="545" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">ids 200k - 300k</text>

<text x="340" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">each batch ~1.5MB in memory, discarded once merged</text>
</svg>
