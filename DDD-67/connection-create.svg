<text x="866" y="680" font-family="'Red Hat Text',Arial,sans-serif" font-size="10.5" fill="#8a8d90" text-anchor="end">typed ${</text>
<rect x="580" y="692" width="300" height="28" fill="#e0f0ff"/>
<text x="594" y="711" font-family="'Red Hat Text',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#151515">ecommerce</text>
<text x="594" y="739" font-family="'Red Hat Mono',monospace" font-size="13" fill="#151515">username</text>
<rect x="580" y="748" width="300" height="28" fill="#e0f0ff"/>
<text x="594" y="767" font-family="'Red Hat Mono',monospace" font-size="13" font-weight="500" fill="#151515">password</text>
<path d="M850 763 l4 4 8-9" fill="none" stroke="#0066cc" stroke-width="1.8"/>
<text x="594" y="805" font-family="'Red Hat Text',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#151515">kafka</text>
<text x="594" y="833" font-family="'Red Hat Mono',monospace" font-size="13" fill="#151515">username</text>
<text x="594" y="861" font-family="'Red Hat Mono',monospace" font-size="13" fill="#151515">password</text>
<line x1="580" y1="878" x2="880" y2="878" stroke="#d2d2d2"/>
<text x="594" y="906" font-family="'Red Hat Text',Arial,sans-serif" font-size="12" fill="#4d4d4d">Select a key or finish typing the reference.</text>
<rect x="872" y="204" width="512" height="224" rx="8" fill="#ffffff" stroke="#d2d2d2"/>
<text x="892" y="234" font-family="'Red Hat Display',Arial,sans-serif" font-size="16" font-weight="500" fill="#151515">Prefix-triggered references</text>
<g font-family="'Red Hat Text',Arial,sans-serif" font-size="12.5" fill="#4d4d4d">
<text x="892" y="266">1. Keep typing for an ordinary literal value.</text>
<text x="892" y="294">2. Type ${ to list registered vaults and keys.</text>
<text x="892" y="322">3. Select a key, or type/paste the full expression.</text>
<text x="892" y="350">References also work inside longer values.</text>
<text x="892" y="386">The autocomplete list requires vault:read when IAM is on.</text>
<text x="892" y="408">Saving the connection requires connection:write.</text>
</g>
<rect x="872" y="454" width="512" height="150" rx="8" fill="#ffffff" stroke="#d2d2d2"/>
<text x="892" y="484" font-family="'Red Hat Display',Arial,sans-serif" font-size="16" font-weight="500" fill="#151515">What is saved</text>
<text x="892" y="510" font-family="'Red Hat Text',Arial,sans-serif" font-size="12.5" fill="#4d4d4d">The connection stores references. Values remain in the secret store.</text>
<rect x="892" y="530" width="472" height="54" rx="6" fill="#f2f2f2"/>
<text x="906" y="552" font-family="'Red Hat Mono',monospace" font-size="11.5" fill="#151515">"username": "${vault::ecommerce/username}",</text>
<text x="906" y="574" font-family="'Red Hat Mono',monospace" font-size="11.5" fill="#151515">"password": "${vault::ecommerce/password}"</text>
