<rect x="420" y="962" width="164" height="36" rx="18" fill="#0066cc"/>
<text x="502" y="985" font-family="'Red Hat Text',Arial,sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Create connection</text>
<text x="612" y="985" font-family="'Red Hat Text',Arial,sans-serif" font-size="14" fill="#0066cc">Cancel</text>
<text x="684" y="978" font-family="'Red Hat Text',Arial,sans-serif" font-size="12.5" fill="#4d4d4d">Validation uses the conductor's dedicated design-time identity.</text>
<text x="684" y="995" font-family="'Red Hat Text',Arial,sans-serif" font-size="12.5" fill="#4d4d4d">Resolved values are neither returned nor persisted.</text>
<text x="1392" y="1020" font-family="'Red Hat Text',Arial,sans-serif" font-size="11" fill="#8a8d90" text-anchor="end">Mockup for DDD-67, not final UI</text>
