<text x="312" y="670" font-family="'Red Hat Text',Arial,sans-serif" font-size="11.5" fill="#4d4d4d">References are stored as text.</text>
<text x="312" y="688" font-family="'Red Hat Text',Arial,sans-serif" font-size="11.5" fill="#4d4d4d">No secret value is sent to the platform.</text>
