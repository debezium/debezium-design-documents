<rect x="580" y="614" width="252" height="36" rx="6" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<text x="324" y="637" font-family="'Red Hat Mono',monospace" font-size="11.5" fill="#151515">${vault::ecommerce/username}</text>
<text x="592" y="637" font-family="'Red Hat Mono',monospace" font-size="14" fill="#151515">${</text>
