<text x="554" y="136" font-family="'Red Hat Text',Arial,sans-serif" font-size="12" fill="#151515">PostgreSQL</text>
<text x="312" y="168" font-family="'Red Hat Text',Arial,sans-serif" font-size="14" fill="#4d4d4d">Literal values still work as before. Type ${ in any field to insert a vault reference.</text>
