<text x="312" y="168" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#4d4d4d" text-anchor="start">Register a reference to credentials that already exist in the secret store. No secret value is entered here.</text>
<text x="312" y="214" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#151515">Name<tspan fill="#b1380b" dx="3">*</tspan></text><rect x="312" y="224" width="520" height="36" rx="6" fill="#ffffff" stroke="#8a8d90" stroke-width="1"/><text x="324" y="247" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#151515" text-anchor="start">ecommerce</text><text x="312" y="280" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Pipeline authors use it in references: ${vault::ecommerce/&lt;key&gt;}</text>
<text x="312" y="314" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#151515">Description</text><rect x="312" y="324" width="520" height="36" rx="6" fill="#ffffff" stroke="#8a8d90" stroke-width="1"/><text x="324" y="347" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#151515" text-anchor="start">PostgreSQL ecommerce, dynamic role per pod</text>
<text x="312" y="400" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#151515">Path in the secret store<tspan fill="#b1380b" dx="3">*</tspan></text><rect x="312" y="410" width="520" height="36" rx="6" fill="#ffffff" stroke="#8a8d90" stroke-width="1"/><text x="324" y="433" font-family="'Red Hat Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#151515" text-anchor="start">db/ecommerce/creds/pipeline</text><text x="312" y="466" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Where the pipeline pod reads. A reference never carries a path,</text><text x="312" y="483" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">so pipeline authors cannot point it somewhere else.</text>
<text x="312" y="518" font-family="'Red Hat Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#151515">Keys<tspan fill="#b1380b" dx="3">*</tspan></text>
